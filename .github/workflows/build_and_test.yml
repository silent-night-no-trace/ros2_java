name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Build desktop artifacts (Docker)
        run: USE_CN_MIRROR=0 ./docker/build.sh desktop
      - name: Upload desktop artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop
          path: output/desktop/
          if-no-files-found: error

  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Build Android AAR (Docker)
        run: USE_CN_MIRROR=0 ./docker/build.sh android
      - name: Upload Android AAR
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android
          path: output/android/
          if-no-files-found: error
